name: sistema_asistencia
description: Control de asistencia por QR, offline-first.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Base de datos local
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # QR
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Seguridad / almacenamiento
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Conectividad
  connectivity_plus: ^6.0.3

  # Estado
  provider: ^6.1.2

  # Red
  http: ^1.2.1

  # Utilidades
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1

  # Notificaciones locales (opcional)
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
